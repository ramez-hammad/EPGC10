name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  simulator:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Configure simulator
        run: cmake -S sim -B build-sim

      - name: Build simulator
        run: cmake --build build-sim -j$(nproc)

      - name: Run unit tests
        run: ./build-sim/test_lexer && ./build-sim/test_evaluator

  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Build firmware
        shell: bash
        run: . $IDF_PATH/export.sh && idf.py build
